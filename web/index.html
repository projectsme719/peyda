<style>
:root{--bg:#EEF1F6;--d:rgba(163,177,198,.6);--l:#fff;--g:#00B894;--gd:#006644;--gl:#A7E22E;--ink:#1F2937;--mute:#6B7280;
--out:6px 6px 14px var(--d),-6px -6px 14px var(--l);--sm:3px 3px 8px var(--d),-3px -3px 8px var(--l);--in:inset 3px 3px 7px var(--d),inset -3px -3px 7px var(--l)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn','IRANSans',system-ui,sans-serif;font-size:14px;overflow-x:hidden;touch-action:manipulation}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.25em}
.ic.on{fill:currentColor}
.top{background:linear-gradient(135deg,var(--gd),#00805a);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 20px;border-radius:0 0 28px 28px;box-shadow:0 8px 20px rgba(0,100,70,.25)}
.top>*{max-width:560px;margin-inline:auto}
.row{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;line-height:1.1}
.logo small{display:block;font-size:9px;letter-spacing:3px;opacity:.8;font-weight:500}
.pill{margin-inline-start:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:8px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.slogan{margin:14px 0 10px;font-weight:700}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 14px;outline:none;background:#fff;color:var(--ink);box-shadow:inset 2px 2px 6px rgba(0,0,0,.12)}
.search button{border:0;border-radius:14px;background:var(--gl);color:var(--gd);font-weight:700;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px}
.search .sq{background:rgba(255,255,255,.18);color:#fff;padding:0 12px}
main{padding:14px 14px 110px;max-width:560px;margin:0 auto}
main.pt{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
h2{font-size:15px;margin:8px 2px 12px;display:flex;align-items:center;gap:8px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-bottom:16px}
.cat{background:var(--bg);box-shadow:var(--sm);border:0;border-radius:16px;padding:10px 2px 8px;text-align:center;font-size:10.5px;line-height:1.5;color:var(--ink)}
.cat .ci{width:38px;height:38px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;color:var(--g);background:var(--bg);box-shadow:var(--in);font-size:18px}
.cat.on{box-shadow:var(--in)}
.cat.on .ci{color:#fff;background:var(--g);box-shadow:var(--sm)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--bg);box-shadow:var(--out);border-radius:20px;overflow:hidden}
.ph{aspect-ratio:4/3;background:#dfe5ec center/cover no-repeat;display:grid;place-items:center;color:#9aa5b4;font-size:30px}
.cb{padding:9px 11px 12px}
.cb h3{margin:0 0 5px;font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{color:var(--gd);font-weight:800;font-size:13px}
.pr.big{font-size:19px;margin:6px 0}
.mt{color:var(--mute);font-size:11px;margin-top:4px;line-height:1.7;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--bg);box-shadow:var(--in);color:var(--mute);display:inline-flex;gap:3px;align-items:center}
.tg.shop{color:var(--gd);font-weight:700}
.seg{display:flex;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:4px;gap:4px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:12px;padding:9px 4px;color:var(--mute);font-size:13px;font-weight:500}
.seg button.on{background:var(--g);color:#fff;box-shadow:var(--sm);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{background:var(--bg);box-shadow:var(--sm);color:var(--gd);border-radius:99px;padding:5px 11px;font-size:12px;border:0;display:flex;gap:5px;align-items:center}
.more{display:block;margin:16px auto 0;background:var(--g);color:#fff;border:0;border-radius:14px;padding:11px 26px;font-weight:700;box-shadow:var(--sm)}
.empty{text-align:center;color:var(--mute);padding:40px 0;line-height:2}
.empty .ic{width:42px;height:42px;display:block;margin:0 auto 8px;opacity:.6}
nav{position:fixed;inset-inline:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:520px;margin:0 auto;background:var(--bg);border-radius:28px;box-shadow:var(--out);display:flex;justify-content:space-around;align-items:center;padding:6px 6px;z-index:10}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mute);font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ni{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px}
nav button.on{color:var(--g);font-weight:700}
nav button.on .ni{box-shadow:var(--in)}
nav .fab{flex:0 0 56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#12d1a8,#00a383);color:#fff;margin-top:-26px;box-shadow:5px 5px 12px rgba(0,150,120,.4),-4px -4px 10px #fff;padding:0;justify-content:center}
nav .fab .ic{width:26px;height:26px}
.bdg{position:absolute;top:-2px;inset-inline-end:14%;background:#e11d48;color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.sheet{position:fixed;inset:0;background:rgba(20,30,40,.4);z-index:30;display:flex;align-items:flex-end}
.sheet .box{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:88vh;overflow:auto}
label.l{display:block;margin:0 0 12px;color:var(--mute);font-size:12px}
input:not([type=checkbox]),select,textarea{display:block;width:100%;margin-top:5px;padding:12px 14px;border:0;border-radius:14px;background:var(--bg);box-shadow:var(--in);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:18px 52%,13px 52%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:32px}
label.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--ink);font-size:14px}
label.chk input{width:20px;height:20px;margin:0;accent-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;border:0;background:linear-gradient(145deg,#12d1a8,#00a383);color:#fff;border-radius:16px;padding:13px;font-weight:700;margin-top:10px;width:100%;box-shadow:4px 4px 10px rgba(0,150,120,.35),-3px -3px 8px #fff;font-size:15px}
.btn.alt{background:var(--bg);color:var(--gd);box-shadow:var(--sm)}
.btn:active{box-shadow:var(--in)}
.btn:disabled{opacity:.6}
.detail{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20}
.detail>.in{max-width:560px;margin:0 auto}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;background:#dfe5ec}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;background:#dfe5ec center/contain no-repeat;display:grid;place-items:center;color:#9aa5b4;font-size:40px}
.dots{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
.dbody{padding:14px 14px 40px}
.dbody.comp{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
.dbody h1{font-size:17px;line-height:1.7;margin:0;flex:1}
.ib{border:0;background:var(--bg);box-shadow:var(--sm);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;color:var(--g);font-size:20px;flex:none}
.ib:active{box-shadow:var(--in)}
.desc{white-space:pre-wrap;line-height:1.9;margin:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;font-size:13px}
.kv span{color:var(--mute)}
.kvbox{background:var(--bg);box-shadow:var(--in);border-radius:16px;margin:10px 0;padding:4px 0}
.note,.warn{background:var(--bg);box-shadow:var(--in);border-radius:14px;padding:11px 13px;margin:10px 0;font-size:12.5px;line-height:1.8;display:flex;gap:8px}
.warn{color:#b45309}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:10px;z-index:25}
.x.ib{width:40px;height:40px;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center;font-size:13px}
#toast.on{opacity:1;transform:translateX(-50%)}
.me{background:var(--bg);box-shadow:var(--out);border-radius:22px;padding:20px;text-align:center;margin-bottom:14px}
.me .av{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;box-shadow:var(--in);color:var(--g);font-size:30px}
.sec{background:var(--bg);box-shadow:var(--out);border-radius:20px;padding:14px;margin-bottom:14px}
.sec .sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:10px}
.sec .sh b{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:12px}
.sec .cats{margin-bottom:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.th{position:relative;width:74px;height:74px;border-radius:16px;background:#dfe5ec center/cover no-repeat;box-shadow:var(--sm)}
.th b{position:absolute;top:-7px;inset-inline-end:-7px;width:24px;height:24px;border-radius:50%;background:#e11d48;color:#fff;display:grid;place-items:center;font-size:11px}
.th b .ic{width:13px;height:13px}
.addph{width:74px;height:74px;border:0;border-radius:16px;display:grid;place-items:center;color:var(--g);background:var(--bg);box-shadow:var(--sm);font-size:26px}
.act{display:flex;flex-wrap:wrap;gap:6px;padding-top:0}
.mini{border:0;border-radius:11px;padding:7px 9px;background:var(--bg);box-shadow:var(--sm);color:var(--ink);font-size:11.5px;display:flex;gap:4px;align-items:center}
.mini:active{box-shadow:var(--in)}
.st{display:inline-flex;align-items:center;gap:5px}
.st i{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.st.active i{background:var(--g)}.st.sold i{background:#e11d48}.st.pending i,.st.hidden i{background:#f59e0b}
.crow{display:flex;gap:10px;align-items:center;background:var(--bg);box-shadow:var(--sm);border-radius:18px;padding:11px 13px;margin-bottom:10px}
.cav{width:44px;height:44px;border-radius:50%;box-shadow:var(--in);display:grid;place-items:center;color:var(--g);font-size:20px;flex:none}
.cmid{flex:1;min-width:0}
.cmid b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmid .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cend{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.cend .bdg{position:static}
.chat{position:fixed;left:0;top:0;width:100%;z-index:22;background:var(--bg)}
.chatbox{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.chead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 12px;background:linear-gradient(135deg,var(--gd),#00805a);color:#fff;border-radius:0 0 22px 22px}
.chead .ct{flex:1;min-width:0}
.chead .ct b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ct small{opacity:.85;font-size:11px}
.cx{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none;font-size:18px}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;line-height:1.8;font-size:14px;word-break:break-word}
.b.me{align-self:flex-start;background:linear-gradient(145deg,#12d1a8,#00a383);color:#fff;border-bottom-right-radius:5px;margin:0;padding:9px 13px;text-align:start;box-shadow:3px 3px 8px rgba(0,150,120,.3)}
.b.they{align-self:flex-end;background:var(--bg);box-shadow:var(--sm);border-bottom-left-radius:5px}
.bt{white-space:pre-wrap}
.tm{font-size:10px;opacity:.7;margin-top:2px}
.cin{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
.cin textarea{flex:1;margin:0;max-height:110px;resize:none;border-radius:20px}
.send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(145deg,#12d1a8,#00a383);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sm)}
.send .ic{transform:scaleX(-1)}
.cblock{flex:1;text-align:center;color:var(--mute);font-size:12.5px;padding:8px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
#seo{max-width:560px;margin:0 auto;padding:6px 14px 100px;text-align:center;font-size:12px;line-height:2.2;color:var(--mute)}
#seo a{color:var(--gd);margin:0 6px;white-space:nowrap}
</style>
</head>

</defs></svg>

<div id="view"></div>
<nav id="nav">
  <button data-tab="home"><span class="ni"><svg class="ic"><use href="#i-home"/></svg></span>خانه</button>
  <button data-tab="chats"><span class="ni"><svg class="ic"><use href="#i-chat"/></svg></span>گفتگو<i class="bdg hidden" id="bdg"></i></button>
  <button class="fab" id="fab"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button data-tab="saved"><span class="ni"><svg class="ic"><use href="#i-star"/></svg></span>نشان‌شده</button>
  <button data-tab="me"><span class="ni"><svg class="ic"><use href="#i-user"/></svg></span>من</button>
</nav>
<nav id="seo" aria-label="فهرست آگهی‌ها">
<a href="/ads">همهٔ آگهی‌ها</a>
<a href="/c/realestate">خانه و املاک</a>
<a href="/c/vehicles">موتر</a>
<a href="/c/mobile">موبایل و تبلت</a>
<a href="/c/computer">کامپیوتر و لوازم جانبی</a>
<a href="/c/home">لوازم خانگی و آشپزخانه</a>
<a href="/c/jobs">استخدام و کار</a>
<a href="/c/services">خدمات</a>
<a href="/c/fashion">لباس و مد</a>
<a href="/c/pets">حیوانات خانگی</a>
<a href="/c/other">سایر موارد</a>
</nav>
<div id="sheet" class="sheet hidden"></div>
<div id="composer" class="detail hidden"></div>
<div id="detail" class="detail hidden"></div>
<div id="chat" class="chat hidden"></div>
<div id="toast"></div>

<script>
(function () {
  var tg = (window.Telegram && window.Telegram.WebApp) || {};
  var isTg = !!(tg.initData && tg.Serverless);
    if (isTg) { var sn = document.getElementById('seo'); if (sn) sn.remove(); }
  if (isTg) {
    try {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#006644'); tg.setBackgroundColor('#EEF1F6'); tg.setBottomBarColor('#EEF1F6');
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
  }

  const CATS = [
    { k: 'realestate', n: 'خانه و املاک', i: 'home' },
    { k: 'vehicles', n: 'موتر', i: 'car' },
    { k: 'mobile', n: 'موبایل و تبلت', i: 'phone' },
    { k: 'computer', n: 'کامپیوتر و لوازم جانبی', i: 'laptop' },
    { k: 'home', n: 'لوازم خانگی و آشپزخانه', i: 'sofa' },
    { k: 'jobs', n: 'استخدام و کار', i: 'briefcase' },
    { k: 'services', n: 'خدمات', i: 'wrench' },
    { k: 'fashion', n: 'لباس و مد', i: 'shirt' },
    { k: 'pets', n: 'حیوانات خانگی', i: 'paw' },
    { k: 'other', n: 'سایر موارد', i: 'grid' },
  ];
  const PROVS = ['کابل','هرات','بلخ','قندهار','ننگرهار','کندز','بغلان','غزنی','پروان','کاپیسا','پنجشیر','بامیان','دایکندی','غور','هلمند','جوزجان','سرپل','فاریاب','بادغیس','نیمروز','فراه','زابل','ارزگان','پکتیا','پکتیکا','خوست','کنر','لغمان','لوگر','میدان وردک','نورستان','سمنگان','تخار','بدخشان'];
  const SORTS = { new: 'جدیدترین', cheap: 'ارزان‌ترین', exp: 'گران‌ترین', views: 'پربازدیدترین' };
  const BOT = 'PEYDA_YaarBot';
  let CFG = null;
  let DEALS = { sale: 'فروشی', exchange: 'معاوضه', rent: 'کرایه', mortgage: 'گروی' };
  let CONDS = { new: 'جدید', used: 'مستعمل' };
  let cfgP = null;
  function ensureCfg() {
    if (CFG) return Promise.resolve();
    if (!cfgP) {
      cfgP = call('config', {}).then((r) => { CFG = r.cfg; DEALS = r.deals; CONDS = r.conds; })
        .catch((e) => { cfgP = null; throw e; });
    }
    return cfgP;
  }

  const $ = (s) => document.querySelector(s);
  const view = $('#view');
  const sheet = $('#sheet');
  const detail = $('#detail');
  const composer = $('#composer');
  const chatEl = $('#chat');

  const ic = (n, c) => '<svg class="ic' + (c ? ' ' + c : '') + '"><use href="#i-' + n + '"/></svg>';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const toLat = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const latin = (s) => toLat(s).replace(/[^\d]/g, '');
  const money = (p) => (p == null ? 'توافقی' : fa(String(p).replace(/\B(?=(\d{3})+(?!\d))/g, ',')) + ' افغانی');
  const loc = (a) => [a.province, a.city].filter(Boolean).join('، ') || '—';
  const catOf = (k) => CATS.find((x) => x.k === k) || { n: '', i: 'grid' };
  const ago = (t) => {
    if (!t) return '';
    const s = Math.max(0, Math.floor(Date.now() / 1000) - t);
    if (s < 60) return 'همین الان';
    if (s < 3600) return fa(Math.floor(s / 60)) + ' دقیقه پیش';
    if (s < 86400) return fa(Math.floor(s / 3600)) + ' ساعت پیش';
    return fa(Math.floor(s / 86400)) + ' روز پیش';
  };
  const hm = (t) => {
    const d = new Date(t * 1000);
    return fa(('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2));
  };
  const waNum = (c) => {
    let d = String(c).replace(/\D/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d[0] === '0') d = '93' + d.slice(1);
    else if (d.length === 9 && d[0] === '7') d = '93' + d;
    return d.length >= 10 ? d : '';
  };
  const btn = (icon, text, attrs, cls) => '<button class="btn ' + (cls || '') + '" ' + attrs + '>' + ic(icon) + '<span>' + text + '</span></button>';

  let tt;
  function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('on'), 2800);
  }

  const call = (name, input) => new Promise((resolve, reject) => {
    if (isTg) {
      tg.Serverless.call(name, input || {}, (err, data) => (err ? reject(err) : resolve(data)));
      return;
    }
    input = input || {};
    if (name === 'config') {
      resolve({
        cfg: {
          realestate: { fields: [{ k: 'rooms', l: 'تعداد اتاق', t: 'select', o: ['۱', '۲', '۳', '۴+'] }], cond: false, deals: ['sale', 'rent', 'mortgage'] },
          vehicles: { fields: [{ k: 'year', l: 'سال ساخت', t: 'num' }], cond: true, deals: ['sale', 'exchange'] },
          mobile: { fields: [], cond: true, deals: ['sale', 'exchange'] },
          computer: { fields: [], cond: true, deals: ['sale', 'exchange'] },
          home: { fields: [], cond: true, deals: ['sale', 'exchange'] },
          jobs: { fields: [], cond: false, deals: [] },
          services: { fields: [], cond: false, deals: [] },
          fashion: { fields: [], cond: true, deals: ['sale'] },
          pets: { fields: [], cond: false, deals: ['sale'] },
          other: { fields: [], cond: true, deals: ['sale', 'exchange'] }
        },
        deals: { sale: 'فروشی', exchange: 'معاوضه', rent: 'کرایه', mortgage: 'گروی' },
        conds: { new: 'جدید', used: 'مستعمل' }
      });
      return;
    }
    if (name === 'ads') {
      const q = new URLSearchParams();
      if (input.q) q.set('q', input.q);
      if (input.category) q.set('category', input.category);
      if (input.province) q.set('province', input.province);
      if (input.minPrice) q.set('minPrice', input.minPrice);
      if (input.maxPrice) q.set('maxPrice', input.maxPrice);
      if (input.sort) q.set('sort', input.sort);
      if (input.seller) q.set('seller', input.seller);
      if (input.page) q.set('page', input.page);
      fetch('/api/ads?' + q.toString())
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error('خطا در دریافت آگهی‌ها'))))
        .then(resolve).catch(reject);
      return;
    }
    if (name === 'ad') {
      fetch('/api/ad?id=' + encodeURIComponent(input.id))
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error('آگهی پیدا نشد'))))
        .then((data) => {
          fetch('/api/contact?id=' + encodeURIComponent(input.id))
            .then((r) => (r.ok ? r.json() : { contact: null }))
            .then((cr) => { data.contact = cr.contact || null; resolve(data); })
            .catch(() => { resolve(data); });
        }).catch(reject);
      return;
    }
    if (name === 'photo') {
      resolve({ src: '/api/img?id=' + encodeURIComponent(input.id) + '&i=' + encodeURIComponent(input.i || 0) + '&t=' + (input.t ? '1' : '0') });
      return;
    }
    if (name === 'canPost') {
      resolve({ ok: true, limit: 10, used: 0, isShop: false });
      return;
    }
    if (name === 'myAds' || name === 'bookmarks' || name === 'chatList') {
      resolve({ items: [], page: 1, pages: 1, total: 0, unread: 0 });
      return;
    }
    if (name === 'me') {
      resolve({ isShop: false, shopName: null, limit: 10, used: 0 });
      return;
    }
    reject(new Error('این قابلیت خارج از تلگرام محدود می‌باشد'));
  });
  const errCode = (e) => (e && e.parameters && e.parameters.code) || '';

  // ---------- وضعیت ----------
  let savedF = {};
  try { savedF = JSON.parse(localStorage.getItem('peyda_f') || '{}'); } catch (e) {}
  const F = { q: '', category: '', province: savedF.province || '', minPrice: '', maxPrice: '', sort: 'new', seller: 'all' };
  const S = { tab: 'home', page: 1, pages: 1, total: 0, items: [], req: 0 };
  const SV = { page: 1, pages: 1, items: [], req: 0 };
  const P = { title: '', cat: '', attrs: {}, cond: '', deal: '', exchangeFor: '', price: '', nego: false, desc: '', files: [], prov: '', city: '', contact: '', useTg: false, busy: false, username: null, info: null };
  const C = { id: null, last: 0, meta: null, timer: null, sending: false, blocked: undefined };
  function resetP() {
    P.title = ''; P.cat = ''; P.attrs = {}; P.cond = ''; P.deal = ''; P.exchangeFor = ''; P.price = '';
    P.nego = false; P.desc = ''; P.files = []; P.prov = F.province || ''; P.city = ''; P.contact = '';
    P.useTg = false; P.busy = false;
  }

  // ---------- عکس‌ها (صف و بارگذاری تنبل) ----------
  const imgCache = new Map();
  const queue = [];
  let active = 0;
  function pump() {
    while (active < 3 && queue.length) {
      const t = queue.shift();
      active++;
      call('photo', { id: Number(t.id), i: Number(t.i), t: t.t ? 1 : 0 })
        .then((d) => t.res(d.src))
        .catch(t.rej)
        .finally(() => { active--; pump(); });
    }
  }
  function fetchPhoto(id, i, thumb) {
    const k = id + ':' + i + ':' + (thumb ? 1 : 0);
    if (imgCache.has(k)) return imgCache.get(k);
    const p = new Promise((res, rej) => { queue.push({ id, i, t: thumb, res, rej }); pump(); });
    imgCache.set(k, p);
    p.catch(() => imgCache.delete(k));
    return p;
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const el = e.target;
    fetchPhoto(el.dataset.id, el.dataset.i, el.dataset.t === '1')
      .then((src) => { el.style.backgroundImage = 'url("' + src + '")'; el.innerHTML = ''; })
      .catch(() => {});
  }), { rootMargin: '300px 600px' });
  const observe = (root) => root.querySelectorAll('[data-lazy]').forEach((el) => io.observe(el));
  const phHtml = (a, thumb) => (a.photos > 0
    ? '<div class="ph" data-lazy data-t="' + (thumb ? 1 : 0) + '" data-id="' + a.id + '" data-i="0">' + ic('image') + '</div>'
    : '<div class="ph">' + ic('image') + '</div>');

  // ---------- کارت آگهی ----------
  function tagsHtml(a) {
    const t = [];
    if (a.shop) t.push('<span class="tg shop">' + ic('store') + 'دوکان‌دار</span>');
    if (a.cond) t.push('<span class="tg">' + esc(CONDS[a.cond] || '') + '</span>');
    if (a.deal && a.deal !== 'sale') t.push('<span class="tg">' + esc(DEALS[a.deal] || '') + '</span>');
    return t.length ? '<div class="tags">' + t.join('') + '</div>' : '';
  }
  function cardHtml(a) {
    return '<article class="card" data-open="' + a.id + '">' + phHtml(a, true) +
      '<div class="cb"><h3>' + esc(a.title) + '</h3><div class="pr">' + money(a.price) + '</div>' +
      '<div class="mt">' + ic('pin') + esc(loc(a)) + '</div><div class="mt">' + ago(a.created) + '</div>' +
      tagsHtml(a) + (a.note ? '<div class="mt">' + esc(a.note) + '</div>' : '') + '</div></article>';
  }

  // ---------- فیلترها ----------
  function chipsHtml() {
    const c = [];
    if (F.q) c.push(['q', '«' + F.q + '»']);
    if (F.category) c.push(['category', catOf(F.category).n]);
    if (F.province) c.push(['province', F.province]);
    if (F.minPrice || F.maxPrice) c.push(['price', (F.minPrice ? 'از ' + money(F.minPrice) : '') + ' ' + (F.maxPrice ? 'تا ' + money(F.maxPrice) : '')]);
    if (F.sort !== 'new') c.push(['sort', SORTS[F.sort]]);
    return c.map((x) => '<button class="chip" data-rm="' + x[0] + '">' + esc(x[1]) + ic('close') + '</button>').join('');
  }
  const hasFilters = () => !!(F.q || F.category || F.province || F.minPrice || F.maxPrice || F.sort !== 'new');

  // ---------- خانه ----------
  function renderHome() {
    view.innerHTML =
      '<header class="top"><div class="row"><div class="logo">' +
      '<svg width="34" height="34" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7E22E"/><stop offset="1" stop-color="#00B894"/></linearGradient></defs><path d="M24 3C14.6 3 7 10.4 7 19.6 7 31 24 45 24 45s17-14 17-25.4C41 10.4 33.4 3 24 3z" fill="url(#lg)"/><circle cx="24" cy="19" r="7.5" fill="#006644"/></svg>' +
      '<div>پیدا<small>PEYDA</small></div></div>' +
      '<button class="pill" data-act="filter">' + ic('pin') + esc(F.province || 'همه ولایت‌ها') + '</button></div>' +
      '<div class="slogan">«هرچه می‌خواهی، پیدا کن!»</div>' +
      '<div class="search"><input id="q" placeholder="جستجو در آگهی‌ها…" enterkeyhint="search" value="' + esc(F.q) + '">' +
      '<button data-act="goq">' + ic('search') + '</button><button class="sq" data-act="filter">' + ic('sliders') + '</button></div></header>' +
      '<main><div class="cats">' + CATS.map((c) => '<button class="cat ' + (F.category === c.k ? 'on' : '') + '" data-cat="' + c.k + '"><span class="ci">' + ic(c.i) + '</span>' + esc(c.n) + '</button>').join('') + '</div>' +
      '<div class="chips" id="chips">' + chipsHtml() + '</div>' +
      '<h2 id="lt">آخرین آگهی‌ها</h2>' +
      '<div class="seg" id="seg">' + [['all', 'همه'], ['shop', 'دوکان‌دار'], ['person', 'شخصی']].map((s) => '<button class="' + (F.seller === s[0] ? 'on' : '') + '" data-seller="' + s[0] + '">' + s[1] + '</button>').join('') + '</div>' +
      '<div id="list" class="grid"></div><div id="more"></div></main>';
    const qi = $('#q');
    qi.addEventListener('input', () => { F.q = qi.value.trim(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { qi.blur(); S.tab = 'home'; render(); } });
    loadList(true);
  }

  async function loadList(reset) {
    const my = ++S.req;
    if (reset) {
      S.page = 1;
      S.items = [];
      const l = $('#list');
      if (l) l.innerHTML = '<div class="empty" style="grid-column:1/-1">در حال بارگذاری…</div>';
    }
    try {
      const r = await call('ads', Object.assign({}, F, { page: S.page }));
      if (my !== S.req) return;
      S.items = reset ? r.items : S.items.concat(r.items);
      S.page = r.page;
      S.pages = r.pages;
      S.total = r.total;
      paintList();
    } catch (e) {
      if (my === S.req) toast(e.message || 'خطا در بارگذاری');
    }
  }

  function paintList() {
    const l = $('#list');
    if (!l) return;
    l.innerHTML = S.items.length ? S.items.map(cardHtml).join('') : '<div class="empty" style="grid-column:1/-1">' + ic('search') + 'آگهی‌ای پیدا نشد</div>';
    const m = $('#more');
    if (m) m.innerHTML = S.page < S.pages ? '<button class="more" data-more="1">نمایش بیشتر</button>' : '';
    const lt = $('#lt');
    if (lt) lt.textContent = (hasFilters() ? 'نتایج جستجو' : 'آخرین آگهی‌ها') + ' (' + fa(S.total) + ')';
    observe(l);
  }

  // ---------- گفتگوها (لیست) ----------
  function setBadge(n) {
    const b = $('#bdg');
    if (!b) return;
    b.textContent = fa(n);
    b.classList.toggle('hidden', !n);
  }
  async function refreshBadge() {
    try {
      const r = await call('chatList', {});
      setBadge(r.unread);
      return r;
    } catch (e) {
      return null;
    }
  }
  function chatRow(c) {
    return '<div class="crow" data-conv="' + c.id + '"><div class="cav">' + ic(c.role === 'buyer' ? 'store' : 'user') + '</div>' +
      '<div class="cmid"><b>' + esc(c.title) + '</b><div class="mt">' + (c.role === 'buyer' ? 'فروشنده' : 'خریدار') + ': ' + esc(c.last) + '</div></div>' +
      '<div class="cend"><div class="mt">' + ago(c.at) + '</div>' + (c.unread ? '<i class="bdg">' + fa(c.unread) + '</i>' : '') + '</div></div>';
  }
  function renderChats() {
    view.innerHTML = '<main class="pt"><h2>' + ic('chat') + 'گفتگوها</h2><div id="clist"><div class="empty">در حال بارگذاری…</div></div></main>';
    loadChats();
  }
  async function loadChats() {
    const r = await refreshBadge();
    const el = $('#clist');
    if (!el) return;
    if (!r) { el.innerHTML = '<div class="empty">خطا در بارگذاری گفتگوها</div>'; return; }
    el.innerHTML = r.items.length ? r.items.map(chatRow).join('') : '<div class="empty">' + ic('chat') + 'هنوز گفتگویی ندارید.<br>در صفحه آگهی روی «گفتگو با فروشنده» بزنید.</div>';
  }

  // ---------- صفحه چت ----------
  function sizeChat() { chatEl.style.height = (tg.viewportHeight || window.innerHeight) + 'px'; }
  if (tg.onEvent) {
    tg.onEvent('viewportChanged', () => {
      if (chatEl.classList.contains('hidden')) return;
      sizeChat();
      const m = $('#msgs');
      if (m) m.scrollTop = m.scrollHeight;
    });
  }

  async function startChat(adId) {
    try {
      const r = await call('chatStart', { adId: adId });
      openChat(r.id);
    } catch (e) {
      toast(e.message || 'خطا');
    }
  }

  async function openChat(id) {
    C.id = id; C.last = 0; C.meta = null; C.blocked = undefined;
    chatEl.classList.remove('hidden');
    chatEl.innerHTML = '<div class="chatbox"><div class="chead"><button class="cx" data-act="chatclose">' + ic('close') + '</button>' +
      '<div class="ct"><b id="ctitle">…</b><small id="csub"></small></div><button class="cx" data-act="chatmenu">' + ic('dots') + '</button></div>' +
      '<div class="msgs" id="msgs"></div><div class="cin" id="cin"></div></div>';
    sizeChat();
    syncBack();
    await pollChat(true);
    clearInterval(C.timer);
    C.timer = setInterval(() => pollChat(false), 3000);
  }

  function closeChat() {
    clearInterval(C.timer);
    C.timer = null;
    C.id = null;
    chatEl.classList.add('hidden');
    chatEl.innerHTML = '';
    syncBack();
    if (S.tab === 'chats') loadChats(); else refreshBadge();
  }

  async function pollChat(first) {
    if (!C.id || (document.hidden && !first)) return;
    const id = C.id;
    try {
      const r = await call('chatMessages', { id: id, after: C.last });
      if (id !== C.id) return;
      applyMeta(r.meta);
      appendMsgs(r.messages, first);
    } catch (e) {
      if (first) { toast(e.message || 'خطا'); closeChat(); }
    }
  }

  function applyMeta(meta) {
    C.meta = meta;
    const t = $('#ctitle');
    if (t) t.textContent = meta.title;
    const s = $('#csub');

  function appendMsgs(list, force) {
    const box = $('#msgs');
    if (!box) return;
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    let added = false;
    list.forEach((m) => {
      if (m.id <= C.last) return;
      C.last = m.id;
      const d = document.createElement('div');
      d.className = 'b ' + (m.mine ? 'me' : 'they');
      d.innerHTML = '<div class="bt">' + esc(m.text) + '</div><div class="tm">' + hm(m.created) + '</div>';
      box.appendChild(d);
      added = true;
    });
    if (added && (force || near)) box.scrollTop = box.scrollHeight;

  async function sendChat() {
    if (C.sending || !C.id) return;
    const inp = $('#cinput');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) return;
    C.sending = true;
    try {

  function compress(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const r = Math.min(1, 1024 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r));
        c.height = Math.max(1, Math.round(img.height * r));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('عکس خوانده نشد')); };
      img.src = url;
    });
  }

  async function addFiles(list) {
    const room = 5 - P.files.length;
    const arr = Array.from(list).slice(0, Math.max(0, room));
    for (const f of arr) {

    }
    paintThumbs();
  }

    if (P.busy) return;
    const cfg = CFG && P.cat ? CFG[P.cat] : null;
    const title = P.title.trim();
    const desc = P.desc.trim();
    if (title.length < 3) return toast('عنوان حداقل ۳ حرف باشد');
    if (!cfg) return toast('دسته‌بندی را انتخاب کنید');
    for (const f of cfg.fields) {
      if (f.req && !(P.attrs[f.k] || '').trim()) return toast('«' + f.l + '» را انتخاب کنید');
    }
    if (cfg.cond && !P.cond) return toast('جدید یا مستعمل را انتخاب کنید');
    if (cfg.deals.length && !P.deal) return toast('نوع معامله را انتخاب کنید');
    let price = null;
    if (P.deal !== 'exchange' && !P.nego) {
      const n = Number(latin(P.price));
      if (!n) return toast('قیمت را بنویسید یا «توافقی» را بزنید');
      price = n;
    }
    if (desc.length < 5) return toast('توضیحات حداقل ۵ حرف باشد');
    if (!P.prov) return toast('ولایت را انتخاب کنید');
    let contact;
    if (P.useTg && P.username) contact = '@' + P.username;
    else {
      contact = toLat(P.contact).replace(/[\s\-()]/g, '');
      if (!/^\+?\d{9,15}$/.test(contact)) return toast('شماره تماس معتبر نیست');
    }

    P.busy = true;
    const b = $('#p_submit');
    if (b) b.disabled = true;
    try {
      const photos = [];
      for (let i = 0; i < P.files.length; i++) {
        setSt('در حال آپلود عکس ' + fa(i + 1) + ' از ' + fa(P.files.length) + '…');
        const r = await call('uploadPhoto', { data: P.files[i].split(',')[1] });
        photos.push({ id: r.id, thumb: r.thumb });
      }
      setSt('در حال انتشار…');
      const r = await call('createAd', {
        title: title, category: P.cat, attrs: P.attrs, cond: P.cond || null, deal: P.deal || null,
        exchangeFor: P.exchangeFor, price: price, description: desc,
        province: P.prov, city: P.city.trim(), contact: contact, photos: photos,
      });
      resetP();
      composer.innerHTML = xbtn('closecomp') + '<div class="dbody comp"><div class="me"><div class="av">' + ic('check') + '</div><h2 style="justify-content:center;margin:0">آگهی شما منتشر شد</h2><div class="mt" style="justify-content:center">در کانال، ربات و مینی‌اپ دیده می‌شود.</div></div>' +
        (r.channelUrl ? btn('megaphone', 'مشاهده در کانال', 'data-url="' + esc(r.channelUrl) + '"') : '') +
        btn('eye', 'مشاهده آگهی', 'data-open="' + r.id + '"', 'alt') + btn('close', 'بستن', 'data-act="closecomp"', 'alt') + '</div>';
    } catch (e) {
      P.busy = false;
      if (b) b.disabled = false;
      setSt('');
      const c = errCode(e);
      if (c === 'NOT_MEMBER' || c === 'LIMIT') paintBlocked({ reason: c, message: e.message });
      else toast(e.message || 'خطا در ثبت آگهی');
    }
  }

  // ---------- برگه فیلتر ----------
  function openSheet() {
    sheet.innerHTML = '<div class="box"><h2>' + ic('sliders') + 'فیلترها</h2>' +
      '<label class="l">دسته‌بندی<select id="f_cat"><option value="">همه</option>' + CATS.map((c) => '<option value="' + c.k + '"' + (F.category === c.k ? ' selected' : '') + '>' + esc(c.n) + '</option>').join('') + '</select></label>' +
      '<label class="l">ولایت<select id="f_prov"><option value="">همه</option>' + PROVS.map((p) => '<option' + (F.province === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></label>' +
      '<div class="two"><label class="l">حداقل قیمت (افغانی)<input id="f_min" inputmode="numeric" value="' + esc(F.minPrice) + '"></label>' +
      '<label class="l">حداکثر قیمت (افغانی)<input id="f_max" inputmode="numeric" value="' + esc(F.maxPrice) + '"></label></div>' +
      '<label class="l">مرتب‌سازی<select id="f_sort">' + Object.keys(SORTS).map((k) => '<option value="' + k + '"' + (F.sort === k ? ' selected' : '') + '>' + SORTS[k] + '</option>').join('') + '</select></label>' +
      '<div class="two">' + btn('check', 'اعمال', 'data-act="apply"') + btn('refresh', 'پاک‌کردن', 'data-act="clear"', 'alt') + '</div></div>';
    sheet.classList.remove('hidden');
    syncBack();
  }
  function closeSheet() { sheet.classList.add('hidden'); sheet.innerHTML = ''; syncBack(); }

  // ---------- رندر ----------
  function render() {
    document.querySelectorAll('#nav [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
    window.scrollTo(0, 0);
    if (S.tab === 'home') renderHome();
    else if (S.tab === 'chats') renderChats();
    else if (S.tab === 'saved') renderSaved();
    else renderMe();
  }

  // ---------- رویدادها ----------
  document.addEventListener('input', (e) => {
    const t = e.target;
    const id = t.id;
    if (t.dataset && t.dataset.attr) P.attrs[t.dataset.attr] = t.value;
    else if (id === 'p_title') P.title = t.value;
    else if (id === 'p_desc') P.desc = t.value;
    else if (id === 'p_price') P.price = t.value;
    else if (id === 'p_city') P.city = t.value;
    else if (id === 'p_contact') P.contact = t.value;
    else if (id === 'p_ex') P.exchangeFor = t.value;
    else if (id === 'cinput') {
      t.style.height = 'auto';
      t.style.height = Math.min(110, t.scrollHeight) + 'px';
    }
  });

  document.addEventListener('change', async (e) => {
    const t = e.target;
    const id = t.id;
    if (t.dataset && t.dataset.attr) P.attrs[t.dataset.attr] = t.value;
    else if (id === 'p_prov') P.prov = t.value;
    else if (id === 'p_nego') { P.nego = t.checked; const pr = $('#p_price'); if (pr) pr.disabled = P.nego; }
    else if (id === 'p_usetg') { P.useTg = t.checked; const c = $('#p_contact'); if (c) c.disabled = P.useTg; }
    else if (id === 'p_files') { await addFiles(t.files); t.value = ''; }
  });

  document.addEventListener('click', (e) => {
    if (e.target === sheet) { closeSheet(); return; }
    if (e.target.closest('#fab')) { resetP(); openComposer(); return; }
    const t = e.target.closest('[data-open],[data-cat],[data-pcat],[data-pset],[data-seller],[data-tab],[data-bm],[data-share],[data-tg],[data-wa],[data-url],[data-chat],[data-conv],[data-more],[data-smore],[data-rm],[data-act]');
    if (!t) return;
    const d = t.dataset;
    if (d.open) { openAd(Number(d.open)); return; }
    if (d.chat) { startChat(Number(d.chat)); return; }
    if (d.conv) { openChat(Number(d.conv)); return; }
    if (d.pcat) { P.cat = d.pcat; P.attrs = {}; P.cond = ''; P.deal = ''; paintComposer(); return; }
    if (d.pset) { P[d.pset] = d.v; paintComposer(); return; }
    if (d.seller) {
      F.seller = d.seller;
      document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.seller === F.seller));
      loadList(true);
      return;
    }
    if (d.cat) { F.category = F.category === d.cat && S.tab === 'home' ? '' : d.cat; S.tab = 'home'; render(); return; }
    if (d.tab) { S.tab = d.tab; render(); return; }
    if (d.bm) { toggleBm(Number(d.bm)); return; }
    if (d.share) {
      const link = 'https://t.me/' + BOT + '?start=ad_' + d.share;
      const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(d.t || '');
      if (tg.openTelegramLink) tg.openTelegramLink(shareUrl); else window.open(shareUrl, '_blank');
      return;
    }
    if (d.tg) {
      const url = 'https://t.me/' + d.tg;
      if (tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
      return;
    }
    if (d.wa) {
      const url = 'https://wa.me/' + d.wa;
      if (tg.openLink) tg.openLink(url); else window.open(url, '_blank');
      return;
    }
    if (d.url) {
      if (tg.openTelegramLink) tg.openTelegramLink(d.url); else window.open(d.url, '_blank');
      return;
    }
    if (d.more) { S.page += 1; loadList(false); return; }
    if (d.smore) { SV.page += 1; loadSaved(false); return; }
    if (d.rm) {
      if (d.rm === 'price') { F.minPrice = ''; F.maxPrice = ''; }
      else if (d.rm === 'sort') F.sort = 'new';
      else F[d.rm] = '';
      render();
      return;
    }
    switch (d.act) {
      case 'goq': S.tab = 'home'; render(); break;
      case 'filter': openSheet(); break;
      case 'apply':
        F.category = $('#f_cat').value;
        F.province = $('#f_prov').value;
        F.minPrice = latin($('#f_min').value);
        F.maxPrice = latin($('#f_max').value);
        F.sort = $('#f_sort').value;
        try { localStorage.setItem('peyda_f', JSON.stringify({ province: F.province })); } catch (err) {}
        closeSheet();
        S.tab = 'home';
        render();
        break;
      case 'clear':
        F.q = ''; F.category = ''; F.province = ''; F.minPrice = ''; F.maxPrice = ''; F.sort = 'new';
        try { localStorage.setItem('peyda_f', '{}'); } catch (err) {}
        closeSheet();
        S.tab = 'home';
        render();
        break;
      case 'closead': closeAd(); break;
      case 'newad': resetP(); openComposer(); break;
      case 'closecomp': closeComposer(); break;
      case 'recheck': openComposer(); break;
      case 'addph': { const fi = $('#p_files'); if (fi) fi.click(); break; }
      case 'rmph': P.files.splice(Number(d.i), 1); paintThumbs(); break;
      case 'submitad': submitAd(); break;
      case 'aa': doAction(Number(d.id), d.a); break;
      case 'shopreq': shopReq(); break;
      case 'chatclose': closeChat(); break;
      case 'chatsend': sendChat(); break;
      case 'chatmenu': chatMenu(); break;
      case 'chatunblock': chatAct('unblock'); break;
      case 'bot': {
        const url = 'https://t.me/' + BOT;
        if (tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
        break;
      }
      case 'channel': {
        const url = 'https://t.me/PeydaAds';
        if (tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
        break;
      }
    }
  });

  if (tg.BackButton && tg.BackButton.onClick) {
    tg.BackButton.onClick(() => {
      if (!sheet.classList.contains('hidden')) closeSheet();
      else if (!chatEl.classList.contains('hidden')) closeChat();
      else if (!detail.classList.contains('hidden')) closeAd();
      else if (!composer.classList.contains('hidden')) closeComposer();
    });
  }

  // نشان گفتگوی نخوانده: هر ۲۵ ثانیه
  setInterval(() => {
    if (document.hidden || !chatEl.classList.contains('hidden')) return;
    if (S.tab === 'chats') loadChats(); else refreshBadge();
  }, 25000);

  render();
  refreshBadge();
  ensureCfg().then(() => { if (S.tab === 'home') paintList(); }).catch(() => {});
  // باز شدن مستقیم یک گفتگو از دکمه نوتیفیکیشن ربات
    // باز شدن مستقیم آگهی یا گفتگو (از دکمه‌های ربات، کانال و لینک‌های startapp)
  
  const qs = new URLSearchParams(location.search);
  const sp = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
  const mAd = sp.match(/^ad_(\d+)$/);
  const mChat = sp.match(/^chat_(\d+)$/);
  const adParam = Number(qs.get('ad')) || (mAd ? Number(mAd[1]) : 0);
  const chatParam = Number(qs.get('chat')) || (mChat ? Number(mChat[1]) : 0);
  if (chatParam) openChat(chatParam);
  else if (adParam) openAd(adParam);
  else if (sp === 'new') { resetP(); openComposer(); }
})();

</script>
</body>
</html>
