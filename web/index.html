<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پیدا | PEYDA</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#00B894;--gd:#006644;--gl:#A7E22E;--ink:#1F2937;--mute:#6B7280;--bg:#F3F4F6;--card:#fff;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn','IRANSans',system-ui,sans-serif;font-size:14px}
button,input,select,textarea,a{font-family:inherit;font-size:inherit}
.hidden{display:none!important}
.top{background:linear-gradient(135deg,var(--gd),#00805a);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 18px;border-radius:0 0 24px 24px}
.row{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;line-height:1.1}
.logo small{display:block;font-size:9px;letter-spacing:3px;opacity:.8;font-weight:500}
.pill{margin-inline-start:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:8px 12px}
.slogan{margin:14px 0 10px;font-weight:700}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;outline:none}
.search button{border:0;border-radius:12px;background:var(--gl);color:var(--gd);font-weight:700;padding:0 14px}
.filterbtn{background:rgba(255,255,255,.18)!important;color:#fff!important}
main{padding:14px 14px 100px}
main.pt{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.cat{background:var(--card);border-radius:14px;padding:10px 2px;text-align:center;font-size:10.5px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.06);border:0;color:var(--ink)}
.cat .i{display:block;font-size:22px;margin-bottom:2px}
.cat.on{outline:2px solid var(--g)}
h2{font-size:15px;margin:6px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ph{aspect-ratio:4/3;background:#e5e7eb center/cover no-repeat;display:grid;place-items:center;color:#9ca3af;font-size:28px}
.cb{padding:8px 10px 10px}
.cb h3{margin:0 0 4px;font-size:13px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{color:var(--gd);font-weight:800;font-size:13px}
.pr.big{font-size:18px;margin:6px 0}
.mt{color:var(--mute);font-size:11px;margin-top:4px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{background:#d1fae5;color:var(--gd);border-radius:99px;padding:4px 10px;font-size:12px;border:0}
.more{display:block;margin:14px auto 0;background:var(--g);color:#fff;border:0;border-radius:12px;padding:10px 24px;font-weight:700}
.empty{text-align:center;color:var(--mute);padding:40px 0;line-height:2}
nav{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:#fff;border-radius:24px;box-shadow:0 6px 24px rgba(0,0,0,.15);display:flex;justify-content:space-around;align-items:center;padding:6px;z-index:10}
nav button{position:relative;flex:1;background:none;border:0;color:var(--mute);font-size:10px;padding:6px 0}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:700}
nav .fab{flex:0 0 52px;height:52px;border-radius:50%;background:var(--g);color:#fff;font-size:28px;margin-top:-22px;box-shadow:0 6px 16px rgba(0,184,148,.45);padding:0}
.bdg{position:absolute;top:0;inset-inline-end:18%;background:#e11d48;color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end}
.sheet .box{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:85vh;overflow:auto}
.sheet label,.form label{display:block;margin:0 0 12px;color:var(--mute);font-size:12px}
.sheet select,.sheet input,.form select,.form input:not([type=checkbox]),.form textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:var(--ink)}
.form label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}
.form label.chk input{width:auto;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;text-align:center;text-decoration:none;border:0;background:var(--g);color:#fff;border-radius:12px;padding:12px;font-weight:700;margin-top:8px;width:100%}
.btn.alt{background:#fff;color:var(--gd);border:1.5px solid var(--g)}
.btn:disabled{opacity:.6}
.detail{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;direction:ltr;background:#e5e7eb}
.slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;background:#e5e7eb center/contain no-repeat;display:grid;place-items:center;color:#9ca3af;font-size:40px}
.dots{text-align:center;color:var(--mute);font-size:12px;margin-top:6px}
.dbody{padding:14px 14px 40px}
.dbody.comp{padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
.dbody h1{font-size:17px;line-height:1.7;margin:0;flex:1}
.icon{border:0;background:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.desc{white-space:pre-wrap;line-height:1.9;margin:0}
.note,.warn{background:#fff7d6;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:12.5px;line-height:1.8}
.x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-start:10px;z-index:25;border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:36px;height:36px;font-size:16px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.me{background:#fff;border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.th{position:relative;width:72px;height:72px;border-radius:12px;background:#e5e7eb center/cover no-repeat}
.th b{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:#fff;font-size:11px;display:grid;place-items:center}
.addph{width:72px;height:72px;border:2px dashed var(--g);border-radius:12px;display:grid;place-items:center;color:var(--g);font-size:26px;background:#fff}
.act{display:flex;flex-wrap:wrap;gap:6px;padding-top:0}
.mini{border:0;border-radius:10px;padding:6px 8px;background:#eef2f7;color:var(--ink);font-size:11px}
.crow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cav{width:42px;height:42px;border-radius:50%;background:#d1fae5;display:grid;place-items:center;font-size:20px;flex:none}
.cmid{flex:1;min-width:0}
.cmid b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmid .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cend{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.cend .bdg{position:static}
.chat{position:fixed;left:0;top:0;width:100%;z-index:22;background:#E6EDF0}
.chatbox{display:flex;flex-direction:column;height:100%}
.chead{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 10px;background:linear-gradient(135deg,var(--gd),#00805a);color:#fff}
.chead .ct{flex:1;min-width:0}
.chead .ct b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ct small{opacity:.85;font-size:11px}
.cx{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:8px 12px;border-radius:16px;line-height:1.8;font-size:13.5px;word-break:break-word}
.b.me{align-self:flex-start;background:var(--g);color:#fff;border-bottom-right-radius:4px;margin:0}
.b.they{align-self:flex-end;background:#fff;border-bottom-left-radius:4px}
.bt{white-space:pre-wrap}
.tm{font-size:10px;opacity:.7;margin-top:2px}
.cin{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:#fff}
.cin textarea{flex:1;border:1px solid #e5e7eb;border-radius:18px;padding:10px 14px;resize:none;max-height:110px;outline:none;background:#fff;color:var(--ink)}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:18px;flex:none}
.cblock{flex:1;text-align:center;color:var(--mute);font-size:12.5px;padding:8px}
</style>
</head>
<body>
<div id="view"></div>
<nav id="nav">
  <button data-tab="home"><span>🏠</span>خانه</button>
  <button data-tab="chats"><span>💬</span>گفتگو<i class="bdg hidden" id="bdg"></i></button>
  <button class="fab" id="fab">＋</button>
  <button data-tab="saved"><span>⭐</span>نشان‌شده</button>
  <button data-tab="me"><span>👤</span>من</button>
</nav>
<div id="sheet" class="sheet hidden"></div>
<div id="composer" class="detail hidden"></div>
<div id="detail" class="detail hidden"></div>
<div id="chat" class="chat hidden"></div>
<div id="toast"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  // خارج از تلگرام: صفحه ساده و بدون خطا
  if (!tg || !tg.initData || !tg.Serverless) {
    document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:Vazirmatn,system-ui,sans-serif;background:#F3F4F6;color:#1F2937"><div><div style="font-size:54px">📍</div><h1 style="color:#006644;margin:8px 0">پیدا | PEYDA</h1><p>بازار آنلاین نیازمندی‌های افغانستان</p><p style="color:#6B7280">این برنامه فقط داخل تلگرام باز می‌شود.</p><a href="https://t.me/PEYDA_YaarBot" style="display:inline-block;background:#00B894;color:#fff;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700">باز کردن در تلگرام</a></div></div>';
    return;
  }
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#006644'); tg.setBackgroundColor('#F3F4F6'); tg.setBottomBarColor('#FFFFFF'); } catch (e) {}

  const CATS = [
    { k: 'realestate', i: '🏠', n: 'خانه و املاک' },
    { k: 'vehicles', i: '🚗', n: 'موتر' },
    { k: 'mobile', i: '📱', n: 'موبایل و تبلت' },
    { k: 'computer', i: '💻', n: 'کامپیوتر و لوازم جانبی' },
    { k: 'home', i: '🛋', n: 'لوازم خانگی و آشپزخانه' },
    { k: 'jobs', i: '💼', n: 'استخدام و کار' },
    { k: 'services', i: '🤝', n: 'خدمات' },
    { k: 'fashion', i: '👕', n: 'لباس و مد' },
    { k: 'pets', i: '🐾', n: 'حیوانات خانگی' },
    { k: 'other', i: '🔖', n: 'سایر موارد' },
  ];
  const PROVS = ['کابل','هرات','بلخ','قندهار','ننگرهار','کندز','بغلان','غزنی','پروان','کاپیسا','پنجشیر','بامیان','دایکندی','غور','هلمند','جوزجان','سرپل','فاریاب','بادغیس','نیمروز','فراه','زابل','ارزگان','پکتیا','پکتیکا','خوست','کنر','لغمان','لوگر','میدان وردک','نورستان','سمنگان','تخار','بدخشان'];
  const SORTS = { new: 'جدیدترین', cheap: 'ارزان‌ترین', exp: 'گران‌ترین', views: 'پربازدیدترین' };
  const BOT = 'PEYDA_YaarBot';

  const $ = (s) => document.querySelector(s);
  const view = $('#view');
  const sheet = $('#sheet');
  const detail = $('#detail');
  const composer = $('#composer');
  const chatEl = $('#chat');

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = (s) => String(s).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const toLat = (s) => String(s).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const latin = (s) => toLat(s).replace(/[^\d]/g, '');
  const money = (p) => (p == null ? 'توافقی' : fa(String(p).replace(/\B(?=(\d{3})+(?!\d))/g, ',')) + ' افغانی');
  const loc = (a) => [a.province, a.city].filter(Boolean).join('، ') || '—';
  const catLabel = (k) => { const c = CATS.find((x) => x.k === k); return c ? c.i + ' ' + c.n : ''; };
  const ago = (t) => {
    if (!t) return '';
    const s = Math.max(0, Math.floor(Date.now() / 1000) - t);
    if (s < 60) return 'همین الان';
    if (s < 3600) return fa(Math.floor(s / 60)) + ' دقیقه پیش';
    if (s < 86400) return fa(Math.floor(s / 3600)) + ' ساعت پیش';
    return fa(Math.floor(s / 86400)) + ' روز پیش';
  };
  const hm = (t) => {
    const d = new Date(t * 1000);
    return fa(('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2));
  };
  const waNum = (c) => {
    let d = String(c).replace(/\D/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d[0] === '0') d = '93' + d.slice(1);
    else if (d.length === 9 && d[0] === '7') d = '93' + d;
    return d.length >= 10 ? d : '';
  };

  let tt;
  function toast(m) {
    const t = $('#toast');
    t.textContent = m;
    t.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(() => t.classList.remove('on'), 2800);
  }

  const call = (name, input) => new Promise((resolve, reject) => {
    tg.Serverless.call(name, input || {}, (err, data) => (err ? reject(err) : resolve(data)));
  });
  const errCode = (e) => (e && e.parameters && e.parameters.code) || '';

  // ---------- وضعیت ----------
  let savedF = {};
  try { savedF = JSON.parse(localStorage.getItem('peyda_f') || '{}'); } catch (e) {}
  const F = { q: '', category: '', province: savedF.province || '', minPrice: '', maxPrice: '', sort: 'new' };
  const S = { tab: 'home', page: 1, pages: 1, total: 0, items: [], req: 0 };
  const SV = { page: 1, pages: 1, items: [], req: 0 };
  const P = { cat: '', title: '', desc: '', price: '', nego: false, prov: '', city: '', contact: '', useTg: false, files: [], busy: false, username: null };
  const C = { id: null, last: 0, meta: null, timer: null, sending: false, blocked: undefined };
  function resetP() {
    P.cat = ''; P.title = ''; P.desc = ''; P.price = ''; P.nego = false; P.prov = F.province || '';
    P.city = ''; P.contact = ''; P.useTg = false; P.files = []; P.busy = false;
  }

  // ---------- عکس‌ها (صف و بارگذاری تنبل) ----------
  const imgCache = new Map();
  const queue = [];
  let active = 0;
  function pump() {
    while (active < 3 && queue.length) {
      const t = queue.shift();
      active++;
      call('photo', { id: Number(t.id), i: Number(t.i), t: t.t ? 1 : 0 })
        .then((d) => t.res(d.src))
        .catch(t.rej)
        .finally(() => { active--; pump(); });
    }
  }
  function fetchPhoto(id, i, thumb) {
    const k = id + ':' + i + ':' + (thumb ? 1 : 0);
    if (imgCache.has(k)) return imgCache.get(k);
    const p = new Promise((res, rej) => { queue.push({ id, i, t: thumb, res, rej }); pump(); });
    imgCache.set(k, p);
    p.catch(() => imgCache.delete(k));
    return p;
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    const el = e.target;
    fetchPhoto(el.dataset.id, el.dataset.i, el.dataset.t === '1')
      .then((src) => { el.style.backgroundImage = 'url("' + src + '")'; el.textContent = ''; })
      .catch(() => { el.textContent = '🖼'; });
  }), { rootMargin: '300px 600px' });
  const observe = (root) => root.querySelectorAll('[data-lazy]').forEach((el) => io.observe(el));

  // ---------- کارت آگهی ----------
  function cardHtml(a) {
    const img = a.photos > 0
      ? '<div class="ph" data-lazy data-t="1" data-id="' + a.id + '" data-i="0"></div>'
      : '<div class="ph">🖼</div>';
    return '<article class="card" data-open="' + a.id + '">' + img +
      '<div class="cb"><h3>' + esc(a.title) + '</h3><div class="pr">' + money(a.price) + '</div>' +
      '<div class="mt">' + esc(loc(a)) + ' • ' + ago(a.created) + '</div>' +
      (a.note ? '<div class="mt">📝 ' + esc(a.note) + '</div>' : '') + '</div></article>';
  }

  // ---------- فیلترها ----------
  function chipsHtml() {
    const c = [];
    if (F.q) c.push(['q', '«' + F.q + '»']);
    if (F.category) c.push(['category', catLabel(F.category)]);
    if (F.province) c.push(['province', '📍 ' + F.province]);
    if (F.minPrice || F.maxPrice) c.push(['price', '💰 ' + (F.minPrice ? 'از ' + money(F.minPrice) : '') + ' ' + (F.maxPrice ? 'تا ' + money(F.maxPrice) : '')]);
    if (F.sort !== 'new') c.push(['sort', '↕️ ' + SORTS[F.sort]]);
    return c.map((x) => '<button class="chip" data-rm="' + x[0] + '">' + esc(x[1]) + ' ✕</button>').join('');
  }
  const hasFilters = () => !!(F.q || F.category || F.province || F.minPrice || F.maxPrice || F.sort !== 'new');

  // ---------- خانه ----------
  function renderHome() {
    view.innerHTML =
      '<header class="top"><div class="row"><div class="logo">' +
      '<svg width="34" height="34" viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7E22E"/><stop offset="1" stop-color="#00B894"/></linearGradient></defs><path d="M24 3C14.6 3 7 10.4 7 19.6 7 31 24 45 24 45s17-14 17-25.4C41 10.4 33.4 3 24 3z" fill="url(#lg)"/><circle cx="24" cy="19" r="7.5" fill="#006644"/></svg>' +
      '<div>پیدا<small>PEYDA</small></div></div>' +
      '<button class="pill" data-act="filter">📍 ' + esc(F.province || 'همه ولایت‌ها') + '</button></div>' +
      '<div class="slogan">«هرچه می‌خواهی، پیدا کن!»</div>' +
      '<div class="search"><input id="q" placeholder="جستجو در آگهی‌ها…" enterkeyhint="search" value="' + esc(F.q) + '">' +
      '<button data-act="goq">جستجو</button><button class="filterbtn" data-act="filter">⚙️</button></div></header>' +
      '<main><div class="cats">' + CATS.map((c) => '<button class="cat ' + (F.category === c.k ? 'on' : '') + '" data-cat="' + c.k + '"><span class="i">' + c.i + '</span>' + esc(c.n) + '</button>').join('') + '</div>' +
      '<div class="chips" id="chips">' + chipsHtml() + '</div>' +
      '<h2 id="lt">آخرین آگهی‌ها</h2><div id="list" class="grid"></div><div id="more"></div></main>';
    const qi = $('#q');
    qi.addEventListener('input', () => { F.q = qi.value.trim(); });
    qi.addEventListener('keydown', (e) => { if (e.key === 'Enter') { qi.blur(); S.tab = 'home'; render(); } });
    loadList(true);
  }

  async function loadList(reset) {
    const my = ++S.req;
    if (reset) {
      S.page = 1;
      S.items = [];
      const l = $('#list');

  function compress(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const r = Math.min(1, 1024 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r));
        c.height = Math.max(1, Math.round(img.height * r));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('عکس خوانده نشد')); };
      img.src = url;
    });
  }

  async function addFiles(list) {

    const arr = Array.from(list).slice(0, Math.max(0, room));
    for (const f of arr) {

    }
    paintThumbs();
  }

  async function submitAd() {
    if (P.busy) return;
    const title = P.title.trim();
    const desc = P.desc.trim();
    if (!P.cat) return toast('دسته‌بندی را انتخاب کنید');
    if (title.length < 5) return toast('عنوان حداقل ۵ حرف باشد');
    if (desc.length < 10) return toast('توضیحات حداقل ۱۰ حرف باشد');
    let price = null;
    if (!P.nego) {
      const n = Number(latin(P.price));
      if (!n) return toast('قیمت را بنویسید یا «توافقی» را بزنید');
      price = n;
    }
    if (!P.prov) return toast('ولایت را انتخاب کنید');
    let contact;
    if (P.useTg && P.username) contact = '@' + P.username;
    else {
      contact = toLat(P.contact).replace(/[\s\-()]/g, '');
      if (!/^\+?\d{9,15}$/.test(contact)) return toast('شماره تماس معتبر نیست');
    }

    P.busy = true;
    const btn = $('#p_submit');
    if (btn) btn.disabled = true;
    try {
      const photos = [];
      for (let i = 0; i < P.files.length; i++) {
        setSt('در حال آپلود عکس ' + fa(i + 1) + ' از ' + fa(P.files.length) + '…');
        const r = await call('uploadPhoto', { data: P.files[i].split(',')[1] });
        photos.push({ id: r.id, thumb: r.thumb });
      }
      setSt('در حال انتشار…');
      const r = await call('createAd', {
        category: P.cat, title: title, description: desc, price: price,
        province: P.prov, city: P.city.trim(), contact: contact, photos: photos,
      });
      resetP();
      composer.innerHTML = '<button class="x" data-act="closecomp">✕</button><div class="dbody comp"><div class="me"><div style="font-size:48px">✅</div><h2>آگهی شما منتشر شد</h2><div class="mt">در کانال، ربات و مینی‌اپ دیده می‌شود.</div></div>' +
        (r.channelUrl ? '<button class="btn" data-url="' + esc(r.channelUrl) + '">📢 مشاهده در کانال</button>' : '') +
        '<button class="btn alt" data-open="' + r.id + '">👁 مشاهده آگهی</button>' +
        '<button class="btn alt" data-act="closecomp">بستن</button></div>';
    } catch (e) {
      P.busy = false;
      if (btn) btn.disabled = false;
      setSt('');
      if (errCode(e) === 'NOT_MEMBER') paintBlocked({ reason: 'NOT_MEMBER', message: e.message });
      else toast(e.message || 'خطا در ثبت آگهی');
    }
  }

  // ---------- برگه فیلتر ----------
  function openSheet() {
    sheet.innerHTML = '<div class="box"><h2>⚙️ فیلترها</h2>' +
      '<label>دسته‌بندی<select id="f_cat"><option value="">همه</option>' + CATS.map((c) => '<option value="' + c.k + '"' + (F.category === c.k ? ' selected' : '') + '>' + c.i + ' ' + esc(c.n) + '</option>').join('') + '</select></label>' +
      '<label>ولایت<select id="f_prov"><option value="">همه</option>' + PROVS.map((p) => '<option' + (F.province === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></label>' +
      '<div class="two"><label>حداقل قیمت (افغانی)<input id="f_min" inputmode="numeric" value="' + esc(F.minPrice) + '"></label>' +
      '<label>حداکثر قیمت (افغانی)<input id="f_max" inputmode="numeric" value="' + esc(F.maxPrice) + '"></label></div>' +
      '<label>مرتب‌سازی<select id="f_sort">' + Object.keys(SORTS).map((k) => '<option value="' + k + '"' + (F.sort === k ? ' selected' : '') + '>' + SORTS[k] + '</option>').join('') + '</select></label>' +
      '<div class="two"><button class="btn" data-act="apply">اعمال</button><button class="btn alt" data-act="clear">پاک‌کردن</button></div></div>';
    sheet.classList.remove('hidden');
    syncBack();
  }
  function closeSheet() { sheet.classList.add('hidden'); sheet.innerHTML = ''; syncBack(); }

  // ---------- رندر ----------
  function render() {
    document.querySelectorAll('#nav [data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === S.tab));
    window.scrollTo(0, 0);
    if (S.tab === 'home') renderHome();
    else if (S.tab === 'chats') renderChats();
    else if (S.tab === 'saved') renderSaved();
    else renderMe();
  }

  // ---------- رویدادها ----------
  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'p_title') P.title = e.target.value;
    else if (id === 'p_desc') P.desc = e.target.value;
    else if (id === 'p_price') P.price = e.target.value;
    else if (id === 'p_city') P.city = e.target.value;
    else if (id === 'p_contact') P.contact = e.target.value;
    else if (id === 'cinput') {
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(110, e.target.scrollHeight) + 'px';
    }
  });

  document.addEventListener('change', async (e) => {
    const id = e.target.id;
    if (id === 'p_prov') P.prov = e.target.value;
    else if (id === 'p_nego') { P.nego = e.target.checked; const pr = $('#p_price'); if (pr) pr.disabled = P.nego; }
    else if (id === 'p_usetg') { P.useTg = e.target.checked; const c = $('#p_contact'); if (c) c.disabled = P.useTg; }
    else if (id === 'p_files') { await addFiles(e.target.files); e.target.value = ''; }
  });

  document.addEventListener('click', (e) => {
    if (e.target === sheet) { closeSheet(); return; }
    if (e.target.id === 'fab') { resetP(); openComposer(); return; }
    const t = e.target.closest('[data-open],[data-cat],[data-pcat],[data-tab],[data-bm],[data-share],[data-tg],[data-wa],[data-url],[data-chat],[data-conv],[data-more],[data-smore],[data-rm],[data-act]');
    if (!t) return;
    const d = t.dataset;
    if (d.open) { openAd(Number(d.open)); return; }
    if (d.chat) { startChat(Number(d.chat)); return; }
    if (d.conv) { openChat(Number(d.conv)); return; }
    if (d.pcat) {
      P.cat = d.pcat;
      document.querySelectorAll('[data-pcat]').forEach((b) => b.classList.toggle('on', b.dataset.pcat === P.cat));
      return;
    }
    if (d.cat) { F.category = F.category === d.cat && S.tab === 'home' ? '' : d.cat; S.tab = 'home'; render(); return; }
    if (d.tab) { S.tab = d.tab; render(); return; }
    if (d.bm) { toggleBm(Number(d.bm)); return; }
    if (d.share) {
      const link = 'https://t.me/' + BOT + '?start=ad_' + d.share;
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent(d.t || ''));
      return;
    }
    if (d.tg) { tg.openTelegramLink('https://t.me/' + d.tg); return; }
    if (d.wa) { tg.openLink('https://wa.me/' + d.wa); return; }
    if (d.url) { tg.openTelegramLink(d.url); return; }
    if (d.more) { S.page += 1; loadList(false); return; }
    if (d.smore) { SV.page += 1; loadSaved(false); return; }
    if (d.rm) {
      if (d.rm === 'price') { F.minPrice = ''; F.maxPrice = ''; }
      else if (d.rm === 'sort') F.sort = 'new';
      else F[d.rm] = '';
      render();
      return;
    }
    switch (d.act) {
      case 'goq': S.tab = 'home'; render(); break;
      case 'filter': openSheet(); break;
      case 'apply':
        F.category = $('#f_cat').value;
        F.province = $('#f_prov').value;
        F.minPrice = latin($('#f_min').value);
        F.maxPrice = latin($('#f_max').value);
        F.sort = $('#f_sort').value;
        try { localStorage.setItem('peyda_f', JSON.stringify({ province: F.province })); } catch (err) {}
        closeSheet();
        S.tab = 'home';
        render();
        break;
      case 'clear':
        F.q = ''; F.category = ''; F.province = ''; F.minPrice = ''; F.maxPrice = ''; F.sort = 'new';
        try { localStorage.setItem('peyda_f', '{}'); } catch (err) {}
        closeSheet();
        S.tab = 'home';
        render();
        break;
      case 'closead': closeAd(); break;
      case 'newad': resetP(); openComposer(); break;
      case 'closecomp': closeComposer(); break;
      case 'recheck': openComposer(); break;
      case 'addph': { const fi = $('#p_files'); if (fi) fi.click(); break; }
      case 'rmph': P.files.splice(Number(d.i), 1); paintThumbs(); break;
      case 'submitad': submitAd(); break;
      case 'aa': doAction(Number(d.id), d.a); break;
      case 'chatclose': closeChat(); break;
      case 'chatsend': sendChat(); break;
      case 'chatmenu': chatMenu(); break;
      case 'chatunblock': chatAct('unblock'); break;
      case 'bot': tg.openTelegramLink('https://t.me/' + BOT); break;
      case 'channel': tg.openTelegramLink('https://t.me/PeydaAds'); break;
    }
  });

  tg.BackButton.onClick(() => {
    if (!sheet.classList.contains('hidden')) closeSheet();
    else if (!chatEl.classList.contains('hidden')) closeChat();
    else if (!detail.classList.contains('hidden')) closeAd();
    else if (!composer.classList.contains('hidden')) closeComposer();
  });

  // نشان گفتگوی نخوانده: هر ۲۵ ثانیه
  setInterval(() => {
    if (document.hidden || !chatEl.classList.contains('hidden')) return;
    if (S.tab === 'chats') loadChats(); else refreshBadge();
  }, 25000);

  render();
  refreshBadge();
  // باز شدن مستقیم یک گفتگو از دکمه نوتیفیکیشن ربات
  const startChatId = Number(new URLSearchParams(location.search).get('chat'));
  if (startChatId) openChat(startChatId);
})();
</script>
</body>
</html>
