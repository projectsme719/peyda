name: Deploy Mini App
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tgcloud init
      - run: npx tgcloud fetch
      - run: npx tgcloud push web/
